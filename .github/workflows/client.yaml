name: TechMarket Orders - Ejecutar Pipeline Blue-Green

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: luciaV1982/AUY1104-SharedWorkflows/.github/workflows/deploy-api.yaml@main

    with:
      image-name: demo-api-lucia
      image-tag: ${{ github.sha }}
      k3s-server-public-ip: ${{ vars.K3S_SERVER_PUBLIC_IP }}

    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EA2_SSH_PRIVATE_KEY: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
